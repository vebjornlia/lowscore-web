:root{
  --paper:#EEF0EB;   /* e-ink grey-green */
  --sheet:#F8F9F6;   /* raised cards */
  --ink:#15191A;
  --ink-2:#4C5552;   /* secondary text, 7.0:1 on paper */
  --rule:#CBD0CA;
  --under:#C21F32;   /* leaderboard red: under par */
  --under-inv:#FF6B7A;
  --display:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:clamp(14px,3.2vw,36px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:var(--display);font-weight:600;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- board ------------------------------------------------------------------------------- */
body.is-board{overflow:hidden}
.board{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
  grid-template-areas:"head" "sub" "rows" "now" "lines" "foot"}
.head{grid-area:head;background:var(--ink);color:var(--paper);display:flex;align-items:baseline;justify-content:space-between;
  gap:1em;padding:.45em var(--pad) .4em;font-size:clamp(18px,4.6vw,34px)}
.head h1{font-weight:700;font-size:1.3em;letter-spacing:.01em;line-height:1}
.head .date{font-size:.8em;white-space:nowrap}
.sub{grid-area:sub;display:flex;justify-content:space-between;gap:1em;padding:.55em var(--pad) .35em;color:var(--ink-2);
  font-size:clamp(13px,3.3vw,22px)}
.sub span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub span:last-child{white-space:nowrap}
.rows{grid-area:rows;display:grid;min-height:0;padding:0}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:.32em;
  padding:0 var(--pad);font-size:calc(var(--rowh,80px)*.62);line-height:1;border-top:1px solid var(--rule);min-height:0}
.row:first-child,.row.leader,.row.leader+.row{border-top-color:transparent}
.row.leader{background:var(--ink);color:var(--paper)}
.rank{font-weight:700;min-width:.55em}
.name{font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;line-height:1.5;display:flex;align-items:baseline;gap:.35em}
.name small{font-weight:600;font-size:.3em;color:var(--ink-2);white-space:nowrap}
.row.leader .name small{color:inherit;opacity:.8}
.score{font-weight:700;font-size:1.22em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.score.under{color:var(--under)}
.row.leader .score.under{color:var(--under-inv)}
.score .pc{font-size:.5em;margin-left:.04em}
.score.raw{font-size:.9em}
.detail{display:none}
.now{grid-area:now;margin:.5em var(--pad) 0;border:2px solid var(--ink);display:flex;align-items:center;gap:.6em;
  font-size:clamp(16px,4.2vw,30px);padding:.18em}
.now b{background:var(--ink);color:var(--paper);padding:.12em .45em;font-weight:700}
.now span{text-transform:uppercase;white-space:nowrap;overflow:hidden}
.lines{grid-area:lines;padding:.45em var(--pad) .1em;font-size:clamp(16px,4.3vw,30px);line-height:1.25}
.lines p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.awards,.season{display:none}
.foot{grid-area:foot;display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:1.5em;row-gap:.1em;margin:.5em var(--pad) 0;
  padding:.45em 0 .6em;border-top:2px solid var(--ink);font-size:clamp(14px,3.6vw,24px)}
.foot span{white-space:nowrap}
.foot .status{color:var(--ink-2)}
.foot .status.stale{color:var(--under);font-weight:700}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:var(--pad);font-size:clamp(20px,5vw,40px);color:var(--ink-2)}
@media (min-aspect-ratio:5/4) and (min-width:760px){
  .board{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "sub side" "rows side" "foot foot"}
  .head{font-size:clamp(22px,2.6vw,40px)}
  .sub{font-size:clamp(14px,1.6vw,24px)}
  .row{grid-template-columns:auto minmax(0,1fr) auto auto}
  .detail{display:block;font-weight:600;font-size:.36em;color:var(--ink-2);text-align:right;margin-right:.7em;white-space:nowrap;line-height:1.15}
  .row.leader .detail{color:inherit;opacity:.85}
  .side{grid-area:side;display:flex;flex-direction:column;gap:1.1em;padding:.6em var(--pad) 0 0;min-height:0}
  .now{margin:0;font-size:clamp(18px,2vw,30px)}
  .lines{padding:0;font-size:clamp(22px,2.6vw,38px);line-height:1.2;display:grid;gap:.5em}
  .lines p{white-space:normal}
  .awards{display:block;font-size:clamp(16px,1.6vw,24px);color:var(--ink-2)}
  .season{display:block;margin-top:auto;padding-bottom:.4em;font-size:clamp(16px,1.6vw,24px);color:var(--ink-2)}
  .awards li{list-style:none;display:flex;justify-content:space-between;gap:1em;padding:.2em 0;border-top:1px solid var(--rule)}
  .awards li b{color:var(--ink);text-transform:uppercase}
  .foot{font-size:clamp(16px,1.7vw,26px)}
}
@media (max-aspect-ratio:5/4),(max-width:759px){.side{display:contents}}

/* ---- setup and join pages ------------------------------------------------------------------- */
.page{max-width:560px;margin:0 auto;padding:22px 22px 120px;display:flex;flex-direction:column;gap:20px;
  font-family:var(--body);font-weight:400;font-size:16px;line-height:1.45}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
.kicker,.label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.kicker{text-align:right}
.page h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:.92;text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.page h1.small{font-size:44px}
.intro{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.hint,.note{font-size:13px;line-height:1.4;color:var(--ink-2)}
.name-input{width:100%;height:58px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);padding:0 14px;color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.04em;text-transform:uppercase}
.name-input::placeholder{color:#8B938F}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{min-height:48px;border:0;background:var(--sheet);color:var(--ink);font:700 16px var(--body);cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.toggle-row{display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0}
.check{display:flex;align-items:center;gap:12px;font-size:16px;cursor:pointer;min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none}
.toggle-row>div{flex:1;display:flex;flex-direction:column;gap:3px}
.switch{flex:none;width:64px;height:36px;border:0;border-radius:18px;background:#9AA19E;padding:4px;display:flex;justify-content:flex-start;cursor:pointer}
.switch span{width:28px;height:28px;border-radius:14px;background:var(--sheet)}
.switch[aria-checked="true"]{background:var(--ink);justify-content:flex-end}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;border:0;border-radius:12px;background:var(--ink);color:var(--sheet);
  text-decoration:none;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0 16px;text-align:center}
.btn[disabled]{opacity:.55;cursor:default}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:transparent;
  color:var(--ink);font:700 15px var(--body);text-decoration:none;cursor:pointer;padding:0 14px}
.btn2.done{border-color:var(--under);color:var(--under)}
.error{color:var(--under);font-weight:700;font-size:15px}
.error:empty{display:none}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;border-top:2px solid var(--ink);padding-top:12px}
.step .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.step .body{display:flex;flex-direction:column;gap:9px;min-width:0}
.step h2{font-family:var(--body);font-weight:700;font-size:17px;line-height:1.3}
.code{font-family:var(--mono);font-size:15px;line-height:1.4;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;
  overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.path{font-size:14px;line-height:1.5}
.path b{font-weight:700}
.apps{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:4px 12px}
.app{padding:10px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.app:first-child{border-top:0}
.app h3{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.step>.wide{grid-column:1/-1}
.auto{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;align-items:center;gap:10px}
.auto .what{display:flex;flex-direction:column;min-width:0}
.auto .trig{font-size:12px;line-height:1.3;color:var(--ink-2)}
.auto code{font-family:var(--mono);font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.tick{width:30px;height:30px;border-radius:15px;border:2px solid #7E8683;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tick svg{display:none}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.tick[aria-pressed="true"] svg{display:block}
.icon{width:40px;height:36px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon.ok{color:var(--under)}
.progress{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.progress.all{color:var(--under)}
.live{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);
  padding:12px 22px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.35;z-index:2}
.live .dot{flex:none;width:12px;height:12px;border-radius:6px;background:#9AA19E;animation:pulse 1.6s ease-in-out infinite}
.live.seen .dot{display:none}
.live svg{flex:none;display:none}
.live.seen svg{display:block}
@keyframes pulse{50%{opacity:.25}}
.qr{background:#fff;padding:14px;width:min(78vw,340px);border-radius:12px;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.link{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline;cursor:pointer;align-self:flex-start}
.link-btn.danger{color:var(--under)}
.link-btn:disabled{opacity:.6;cursor:default}
a{color:var(--ink)}
</style>

var CHECK = '<svg width="18" height="18" viewBox="0 0 26 26" aria-hidden="true"><path d="M6.5 13.5l4.5 4.5 8.5-9.5" fill="none" stroke="#F8F9F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var COPY = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 5.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
var DONE = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SEEN = '<svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#C21F32"/><path d="M7.5 13.5l3.5 3.5 7.5-8" fill="none" stroke="#F8F9F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function copyText(text, onDone){
  function fallback(){
    var ta = el("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); onDone(); } catch (e) {} document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(onDone, fallback); else fallback();
}

// ---- board --------------------------------------------------------------------------------------

function appName(a){ return (view && view.app_names && view.app_names[a]) || a; }
function utc(day){ var p = day.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2], 12); }
function daysBetween(a, b){ return Math.round((utc(b) - utc(a)) / 86400000); }
function addDay(day, n){ return new Date(utc(day) + n * 86400000).toISOString().slice(0, 10); }
function shortDate(day){ return new Intl.DateTimeFormat(w().locale, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).format(new Date(utc(day))); }
function dateLabel(v){ return w().week + " " + v.week + ", " + shortDate(v.today); }

function renderBoard(v){
  var W = w();
  var board = el("main", "board");
  board.setAttribute("aria-live", "polite");
  var head = el("header", "head");
  head.appendChild(el("h1", null, "Lowscore"));
  head.appendChild(el("span", "date", dateLabel(v)));
  board.appendChild(head);
  var sub = el("div", "sub");
  sub.appendChild(el("span", null, W.subtitle));
  sub.appendChild(el("span", null, v.week_final ? t(W.final, { w: v.week }) : W.thisWeek));
  board.appendChild(sub);

  var rows = el("section", "rows");
  rows.setAttribute("aria-label", "Ranking");
  var n = v.players.length;
  if (!n) rows.appendChild(el("p", "empty", W.noData));
  rows.style.gridTemplateRows = "repeat(" + Math.max(n, 1) + ", minmax(0, 1fr))";
  v.players.forEach(function(p){
    var row = el("div", "row" + (p.leader ? " leader" : ""));
    row.appendChild(el("span", "rank", p.rank == null ? "" : String(p.rank)));
    var name = el("span", "name", p.name);
    var tag = null;
    if (p.calibrating && p.calibration) tag = t(W.calibrating, { d: p.calibration.done, n: p.calibration.of });
    else if (p.offline) tag = W.offline;
    if (tag) name.appendChild(el("small", null, tag));
    row.appendChild(name);
    var bits = [];
    if (p.total_min != null) bits.push(W.today + " " + hm(p.total_min));
    if (p.yday_min != null) bits.push(W.yday + " " + hm(p.yday_min));
    if (p.par_min != null) bits.push(W.par + " " + hm(p.par_min));
    var detail = el("span", "detail");
    bits.forEach(function(b, i){ if (i) detail.appendChild(document.createElement("br")); detail.appendChild(document.createTextNode(b)); });
    row.appendChild(detail);
    var score;
    if (p.rank != null && p.pct != null) {
      score = el("span", "score" + (p.pct < 0 ? " under" : ""), pct(p.pct));
      score.appendChild(el("span", "pc", "%"));
    } else {
      score = el("span", "score raw", p.total_min != null ? hm(p.total_min) : "—");
    }
    row.appendChild(score);
    rows.appendChild(row);
  });
  board.appendChild(rows);

  var side = el("aside", "side");
  if (v.now_callout) {
    var now = el("div", "now");
    now.appendChild(el("b", null, W.now));
    now.appendChild(el("span", null, v.now_callout.name + " · " + appName(v.now_callout.app) + " " + v.now_callout.for_min + " min"));
    side.appendChild(now);
  }
  if (v.lines && v.lines.length) {
    var lines = el("div", "lines");
    v.lines.forEach(function(l){ lines.appendChild(el("p", null, l)); });
    side.appendChild(lines);
  }
  if (v.awards && v.awards.length) {
    var ul = el("ul", "awards");
    v.awards.forEach(function(a){
      var li = el("li");
      li.appendChild(el("span", null, W.awards[a.kind] || a.kind));
      li.appendChild(el("b", null, a.name));
      ul.appendChild(li);
    });
    side.appendChild(ul);
  }
  if (v.season) {
    var se = el("p", "season");
    if (v.season.number > 0) se.textContent = t(W.season, { n: v.season.number, w: v.season.week, of: Math.round((daysBetween(v.season.starts_on, v.season.ends_on) + 1) / 7) });
    else se.textContent = t(W.preseason, { d: shortDate(addDay(v.season.ends_on, 1)) });
    side.appendChild(se);
  }
  board.appendChild(side);

  var foot = el("footer", "foot");
  var flat = [];
  if (v.flat.pct != null) flat.push(t(W.flat, { pct: pct(v.flat.pct) }));
  flat.push(t(W.saved, { h: Math.max(0, Math.round(v.flat.hours_saved)) }));
  foot.appendChild(el("span", null, flat.join(" · ")));
  var status = el("span", "status" + (stale ? " stale" : ""));
  status.textContent = stale && lastOk ? t(W.stale, { t: clock(lastOk) }) : t(W.updated, { t: v.updated_label });
  if (!lock && "wakeLock" in navigator && !stale) status.textContent += " · " + W.keepAwake;
  foot.appendChild(status);
  board.appendChild(foot);
  put(board);
  size();
}

function size(){
  var rows = root.querySelector(".rows");
  if (!rows || !view) return;
  var n = Math.max(view.players.length, 1);
  var h = rows.clientHeight / n;
  var px = Math.min(h, rows.clientWidth / 4.6);
  rows.style.setProperty("--rowh", Math.max(18, px) + "px");
}

// every minute from 07:00 to 24:00 in the flat's time zone, every 15 minutes at night (#poll=<s> overrides)
function pollDelay(){
  var forced = +params.get("poll");
  if (forced >= 15) return forced * 1000;
  var h = 12;
  try { h = +new Intl.DateTimeFormat("en-GB", { timeZone: (view && view.tz) || "Europe/Oslo", hour: "2-digit", hourCycle: "h23" }).format(new Date()); } catch (e) {}
  return h >= 7 ? 60000 : 900000;
}
function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ fetchBoard(); schedule(); }, pollDelay()); }

function fetchBoard(){
  if (!api || !key) return;
  fetch(api + "/board?key=" + encodeURIComponent(key) + "&format=json", { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(v){ view = v; lastOk = new Date(); stale = false; renderBoard(v); })
    .catch(function(){ stale = true; if (view) renderBoard(view); });
}

function keepAwake(){
  if (!("wakeLock" in navigator) || lock || document.visibilityState !== "visible") return;
  navigator.wakeLock.request("screen").then(function(l){
    lock = l;
    l.addEventListener("release", function(){ lock = null; });
    if (view) renderBoard(view);
  }).catch(function(){});
}

// ---- join page: form → POST /join → steps -------------------------------------------------------

var inv = null, saved = null, live = null;
function skey(){ return "lowscore.join." + (inv ? inv.code : code); }
function listApps(W){
  var names = inv.apps.map(function(a){ return a.name; });
  return names.length > 1 ? names.slice(0, -1).join(", ") + " " + W.and + " " + names[names.length - 1] : names.join("");
}
function guessPlatform(){ return /android/i.test(navigator.userAgent) ? "android" : "ios"; }

function renderForm(prefill, error){
  var W = w(inv.lang);
  // roast mode is opt-in: off until the player switches it on (a pre-ticked box is not consent)
  var state = { platform: (prefill && prefill.platform) || guessPlatform(), roast: prefill ? !!prefill.roast : false };
  var page = el("main", "page");
  page.appendChild(top(inv.flat_name));
  var intro = el("div", "intro");
  intro.appendChild(el("h1", null, W.formTitle));
  intro.appendChild(el("p", null, W.formIntro));
  page.appendChild(intro);

  var form = el("form");
  form.className = "intro";
  form.setAttribute("novalidate", "");
  form.style.gap = "20px";
  var nf = el("div", "field");
  var lab = el("label", "label", W.nameLabel); lab.htmlFor = "ls-name"; nf.appendChild(lab);
  var input = el("input", "name-input");
  input.id = "ls-name"; input.name = "name"; input.maxLength = 7; input.required = true; input.placeholder = W.namePlaceholder;
  input.setAttribute("autocomplete", "nickname"); input.setAttribute("autocapitalize", "characters"); input.setAttribute("autocorrect", "off");
  input.setAttribute("spellcheck", "false"); input.setAttribute("aria-describedby", "ls-name-hint");
  if (prefill && prefill.name) input.value = prefill.name;
  nf.appendChild(input);
  var hint = el("div", "hint", W.nameHint); hint.id = "ls-name-hint"; nf.appendChild(hint);
  form.appendChild(nf);

  var pf = el("div", "field");
  var pl = el("div", "label", W.phoneLabel); pl.id = "ls-phone"; pf.appendChild(pl);
  var seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-labelledby", "ls-phone");
  [["ios", W.iphone], ["android", W.android]].forEach(function(o){
    var b = el("button", null, o[1]); b.type = "button"; b.setAttribute("aria-pressed", String(state.platform === o[0]));
    b.addEventListener("click", function(){ state.platform = o[0]; seg.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); });
    seg.appendChild(b);
  });
  pf.appendChild(seg);
  form.appendChild(pf);

  var tr = el("div", "toggle-row");
  var tx = el("div");
  tx.appendChild(el("strong", null, W.roastTitle));
  tx.appendChild(el("span", "hint", W.roastText));
  tr.appendChild(tx);
  var sw = el("button", "switch"); sw.type = "button"; sw.setAttribute("role", "switch"); sw.setAttribute("aria-checked", String(state.roast));
  sw.setAttribute("aria-label", W.roastTitle); sw.appendChild(el("span"));
  sw.addEventListener("click", function(){ state.roast = !state.roast; sw.setAttribute("aria-checked", String(state.roast)); });
  tr.appendChild(sw);
  form.appendChild(tr);

  var card = el("section", "card"); card.setAttribute("aria-label", W.seesTitle);
  card.appendChild(el("div", "label", W.seesTitle));
  card.appendChild(el("div", null, t(W.sees1, { apps: listApps(W) })));
  card.appendChild(el("div", null, W.sees2));
  card.appendChild(el("div", null, W.sees3));
  form.appendChild(card);

  // the age gate (13: personopplysningsloven § 5) and the documents the player agrees to
  var ageRow = el("label", "check");
  var age = el("input"); age.type = "checkbox"; age.id = "ls-age"; age.required = true;
  if (prefill && prefill.age) age.checked = true;
  ageRow.appendChild(age); ageRow.appendChild(el("span", null, W.age));
  form.appendChild(ageRow);
  if (cfg.site) form.appendChild(legalLine(W));

  var err = el("p", "error", error || ""); err.setAttribute("role", "alert");
  form.appendChild(err);
  var go = el("button", "btn", W.join); go.type = "submit";
  form.appendChild(go);
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = input.value.normalize("NFC").trim();
    if (!/^[A-Za-zÆØÅæøå]{1,7}$/.test(name)) { err.textContent = W.errName; input.focus(); return; }
    if (!age.checked) { err.textContent = W.errAge; age.focus(); return; }
    go.disabled = true; go.textContent = W.joining; err.textContent = "";
    var body = { code: inv.code, name: name.toUpperCase(), platform: state.platform, roast: state.roast, via: "web" };
    fetch(inv.base + "/join", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, body: j }; }); })
      .then(function(res){
        if (res.status === 200 && res.body.token) {
          saved = { name: res.body.name || body.name, platform: state.platform, roast: state.roast, token: res.body.token, player_id: res.body.player_id, checks: {} };
          store(skey(), saved);
          renderDone();
          window.scrollTo(0, 0);
          return;
        }
        var e = res.body && res.body.error || ("HTTP " + res.status);
        err.textContent = res.status === 409 && /full/.test(e) ? W.errFull : res.status === 409 ? t(W.errTaken, { name: body.name })
          : res.status === 404 ? W.errInvite : res.status === 422 ? W.errName : t(W.errOther, { e: e });
        go.disabled = false; go.textContent = W.join;
      })
      .catch(function(){ err.textContent = W.errNetwork; go.disabled = false; go.textContent = W.join; });
  });
  page.appendChild(form);
  put(page);
}

function legalLine(W){
  var p = el("p", "note");
  var parts = W.legal.split(/(\{terms\}|\{privacy\})/);
  parts.forEach(function(x){
    if (x === "{terms}" || x === "{privacy}") {
      var a = el("a", null, x === "{terms}" ? W.termsLink : W.privacyLink);
      a.href = cfg.site + (inv.lang === "en" ? "en/" : "") + (x === "{terms}" ? "terms.html" : "privacy.html");
      a.target = "_blank"; a.rel = "noopener";
      p.appendChild(a);
    } else if (x) p.appendChild(document.createTextNode(x));
  });
  return p;
}

function step(n, title){
  var s = el("section", "step");
  s.appendChild(el("div", "n", String(n)));
  var b = el("div", "body");
  b.appendChild(el("h2", null, title));
  s.appendChild(b);
  return { node: s, body: b };
}

function copyButton(label, text, W, cls){
  var b = el("button", cls || "btn2", label); b.type = "button";
  b.addEventListener("click", function(){
    copyText(text, function(){ b.textContent = W.copied; b.classList.add("done"); setTimeout(function(){ b.textContent = label; b.classList.remove("done"); }, 1800); });
  });
  return b;
}

function renderDone(){
  var W = w(inv.lang);
  var page = el("main", "page");
  var ios = saved.platform !== "android";
  page.appendChild(top(ios ? W.iphoneKicker : W.androidKicker));
  var intro = el("div", "intro");
  intro.appendChild(el("h1", "small", t(W.doneTitle, { name: saved.name })));
  intro.appendChild(el("p", null, ios ? W.iphoneIntro : W.androidIntro));
  page.appendChild(intro);
  if (ios) renderIphoneSteps(page, W); else renderAndroidSteps(page, W);
  page.appendChild(el("p", "note", W.privacy));
  var again = el("button", "link-btn", W.startOver); again.type = "button";
  again.addEventListener("click", function(){ stopLive(); store(skey(), null); saved = null; renderForm(null, ""); });
  page.appendChild(again);
  // leaving deletes the player and every row about them (DELETE /me); two taps, no browser dialog
  var leave = el("button", "link-btn danger", W.leave); leave.type = "button";
  var armed = false, disarm = null;
  leave.addEventListener("click", function(){
    if (!armed) {
      armed = true; leave.textContent = W.leaveConfirm;
      disarm = setTimeout(function(){ armed = false; leave.textContent = W.leave; }, 6000);
      return;
    }
    clearTimeout(disarm); leave.disabled = true; leave.textContent = W.leaving;
    fetch(inv.base + "/me", { method: "DELETE", headers: { Authorization: "Bearer " + saved.token } })
      .then(function(r){ if (!r.ok && r.status !== 401) throw new Error("HTTP " + r.status); renderLeft(ios); })
      .catch(function(){ leave.disabled = false; armed = false; leave.textContent = W.leaveFailed; });
  });
  page.appendChild(leave);
  put(page);
  if (ios) startLive(W);
}

function renderLeft(ios){
  var W = w(inv.lang);
  stopLive(); store(skey(), null); saved = null; live = null;
  var page = el("main", "page");
  page.appendChild(top(inv.flat_name));
  var intro = el("div", "intro");
  intro.appendChild(el("h1", "small", W.leftTitle));
  intro.appendChild(el("p", null, ios ? W.leftIos : W.leftAndroid));
  page.appendChild(intro);
  put(page);
  window.scrollTo(0, 0);
}

function renderIphoneSteps(page, W){
  var s1 = step(1, W.s1);
  s1.body.appendChild(el("div", "code", saved.token));
  var r1 = el("div", "row2"); r1.appendChild(copyButton(W.copyCode, saved.token, W)); s1.body.appendChild(r1);
  s1.body.appendChild(el("div", "note", W.codeNote));
  page.appendChild(s1.node);

  var s2 = step(2, W.s2);
  if (inv.shortcut_url) { var a = el("a", "btn", W.s2Button); a.href = inv.shortcut_url; a.rel = "noopener"; s2.body.appendChild(a); }
  else s2.body.appendChild(el("p", "error", W.s2Missing));
  s2.body.appendChild(el("div", "note", W.s2Note));
  page.appendChild(s2.node);

  var total = inv.apps.length * 2;
  var s3 = step(3, W.s3);
  var prog = el("div", "progress");
  s3.body.appendChild(prog);
  s3.body.appendChild(rich("p", "path", W.s3How));
  var list = el("div", "apps");
  function count(){
    var n = 0; for (var k in saved.checks) if (saved.checks[k]) n++;
    prog.textContent = n >= total ? t(W.progressAll, { total: total }) : t(W.progress, { n: n, total: total });
    prog.className = "progress" + (n >= total ? " all" : "");
  }
  inv.apps.forEach(function(app){
    var box = el("div", "app");
    box.appendChild(el("h3", null, app.name));
    [["open", W.opened], ["close", W.closed]].forEach(function(o){
      var text = app.key + " " + o[0];
      var line = el("div", "auto");
      var tick = el("button", "tick"); tick.type = "button"; tick.innerHTML = CHECK;
      tick.setAttribute("aria-pressed", String(!!saved.checks[text])); tick.setAttribute("aria-label", t(W.markDone, { t: text }));
      tick.addEventListener("click", function(){
        saved.checks[text] = !saved.checks[text]; tick.setAttribute("aria-pressed", String(saved.checks[text])); store(skey(), saved); count();
      });
      line.appendChild(tick);
      var what = el("span", "what");
      what.appendChild(el("span", "trig", o[1]));
      what.appendChild(el("code", null, text));
      line.appendChild(what);
      var cp = el("button", "icon"); cp.type = "button"; cp.innerHTML = COPY; cp.setAttribute("aria-label", t(W.copyText, { t: text }));
      cp.addEventListener("click", function(){ copyText(text, function(){ cp.innerHTML = DONE; cp.classList.add("ok"); setTimeout(function(){ cp.innerHTML = COPY; cp.classList.remove("ok"); }, 1500); }); });
      line.appendChild(cp);
      box.appendChild(line);
    });
    list.appendChild(box);
  });
  list.className = "apps wide";
  s3.node.appendChild(list);
  s3.node.appendChild(el("div", "note wide", W.s3Skip));
  count();
  page.appendChild(s3.node);

  var s4 = step(4, W.s4);
  s4.body.appendChild(rich("p", "path", W.s4Text));
  page.appendChild(s4.node);

  var s5 = step(5, W.s5);
  s5.body.appendChild(el("p", null, W.s5Text));
  page.appendChild(s5.node);

  live = el("div", "live"); live.setAttribute("role", "status"); live.setAttribute("aria-live", "polite");
  live.appendChild(el("span", "dot"));
  var icon = el("span"); icon.innerHTML = SEEN; live.appendChild(icon.firstChild);
  live.appendChild(el("span", "msg", W.liveWaiting));
  page.appendChild(live);
}

function renderAndroidSteps(page, W){
  var s1 = step(1, W.a1);
  if (inv.apk_url) { var a = el("a", "btn", W.a1Button); a.href = inv.apk_url; a.rel = "noopener"; s1.body.appendChild(a); }
  else s1.body.appendChild(el("p", "error", W.a1Missing));
  s1.body.appendChild(el("div", "note", W.a1Note));
  page.appendChild(s1.node);

  var link = inv.deep_link + "&token=" + encodeURIComponent(saved.token);
  var s2 = step(2, W.a2);
  var open = el("a", "btn", W.a2Button); open.href = link; s2.body.appendChild(open);
  s2.body.appendChild(el("div", "note", W.a2Note));
  s2.body.appendChild(el("div", "code", link));
  var r2 = el("div", "row2"); r2.appendChild(copyButton(W.copyLink, link, W)); s2.body.appendChild(r2);
  s2.body.appendChild(el("div", "note", t(W.a2Name, { name: saved.name })));
  page.appendChild(s2.node);

  var s3 = step(3, W.a3);
  s3.body.appendChild(el("p", null, W.a3Text));
  page.appendChild(s3.node);

  var c = el("div", "field");
  c.appendChild(el("div", "label", W.yourCode));
  c.appendChild(el("div", "code", saved.token));
  var r3 = el("div", "row2"); r3.appendChild(copyButton(W.copyCode, saved.token, W)); c.appendChild(r3);
  page.appendChild(c);
}

// the live check: GET /me with the player's code, every 4 s while the page is visible
var liveTimer = null;
function stopLive(){ clearTimeout(liveTimer); liveTimer = null; }
function startLive(W){
  function tick(){
    if (!saved || !live) return;
    if (document.visibilityState !== "visible") { liveTimer = setTimeout(tick, 4000); return; }
    fetch(inv.base + "/me", { headers: { Authorization: "Bearer " + saved.token }, cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(me){
        var msg = live.querySelector(".msg");
        if (me && me.last_event) {
          var at = clock(new Date(me.last_event.at));
          var ping = me.last_event.e === "ping";
          msg.textContent = ping ? t(W.livePing, { t: at }) : t(W.liveSeen, { e: me.last_event.e, t: at });
          live.className = "live" + (ping ? "" : " seen");
        }
      })
      .catch(function(){})
      .then(function(){ liveTimer = setTimeout(tick, 4000); });
  }
  tick();
}

function startInvite(){
  saved = store(skey());
  if (saved && saved.token) renderDone(); else renderForm(null, "");
}

function fetchInvite(){
  if (!api || !code) { put(el("p", "empty", w().missing)); return; }
  fetch(api + "/join-page?code=" + encodeURIComponent(code) + "&format=json", { cache: "no-store" })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j && j.error || "HTTP " + r.status); return j; }); })
    .then(function(j){ inv = j; startInvite(); })
    .catch(function(){ put(el("p", "empty", w().errInvite)); });
}

// ---- start ----------------------------------------------------------------------------------------

if (mode === "invite") {
  if (initial && initial.invite) { inv = initial.invite; startInvite(); } else fetchInvite();
} else if (mode === "setup") {
  if (initial && initial.join) renderSetup(initial.join); else if (api && key) fetchSetup(); else put(el("p", "empty", w().missing));
} else {
  if (view) { lastOk = new Date(); renderBoard(view); }
  else if (!(api && key)) put(el("p", "empty", w().missing));
  fetchBoard();
  if (api && key) schedule();
  keepAwake();
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") { keepAwake(); fetchBoard(); } });
  document.addEventListener("click", function(){
    keepAwake();
    var d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(function(){});
  });
  window.addEventListener("resize", size);
}
})();
</script>
